quarkus.http.port=${ORDER_PROCESSOR_PORT:3002}
quarkus.http.host=0.0.0.0
app.environment=${APP_ENV:dev}
app.security.require-api-key=${APP_REQUIRE_AUTH:false}
app.security.api-key=${APP_API_KEY:unset}
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:appuser}
quarkus.datasource.password=${POSTGRES_PASSWORD:appsecret}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
